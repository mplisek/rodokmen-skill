# Šablona – nginx.conf pro web s více přístupy (data/web.json → pristupy) z ní vyrábí tools/export_web.py.
# Používá se jen při nasazení přes Docker/CapRover. Každý přístup má vlastní verzi webu v /_p/<přístup>/;
# přihlašovací stránka uloží do cookie "rodokmen" otisk (SHA-256) odpovědi a nginx podle něj vybere verzi.
# Cizí verze nejdou otevřít ani přímou adresou (/_p/… zvenku vrací 404).
map $cookie_rodokmen $pristup {
  default "";
{{PRISTUPY}}
}

server {
  listen 80;
  root /usr/share/nginx/html;
  charset utf-8;
  add_header X-Robots-Tag "noindex, nofollow" always;

  # přihlašovací stránka je dostupná vždy
  location = /prihlaseni.html {
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  # verze jednotlivých přístupů nejdou otevřít přímo
  location ^~ /_p/ {
    return 404;
  }

  location / {
    if ($pristup = "") {
      return 401;
    }
    add_header Cache-Control "private, no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /_p/$pristup$uri /_p/$pristup$uri/index.html /_p/$pristup$uri.html =404;
  }

  error_page 401 /prihlaseni.html;
  error_page 404 /_404.html;
  location = /_404.html {
    internal;
    try_files /_p/$pristup/404.html =404;
  }
}
